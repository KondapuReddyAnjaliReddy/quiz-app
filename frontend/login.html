<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <form id="loginForm">
    <h2 id="loginTitle">Login</h2>

    <input type="text" id="username" placeholder="Username" required />
    <input type="password" id="password" placeholder="Password" required />
    <button type="submit">Login</button>

    <!-- ✅ Register link below login button -->
    <p style="margin-top: 20px;">
      Don't have an account?
      <a href="register.html" style="color: #2563eb; font-weight: bold; text-decoration: none;">
        Register here
      </a>
    </p>
  </form>

  <script>
    // Read selected role from localStorage
    const role = localStorage.getItem("role");
    console.log("Role from localStorage:", role);

    if (!role || (role !== "user" && role !== "admin")) {
      alert("Please select your role from the home page first.");
      window.location.href = "home.html";
    }

    document.getElementById("loginTitle").innerText = `Login as ${role}`;

    document.getElementById("loginForm").addEventListener("submit", async function (e) {
      e.preventDefault();

      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;

      const endpoint = role === "admin"
        ? "http://localhost:5000/api/auth/login-admin"
        : "http://localhost:5000/api/auth/login-user";

      try {
        const response = await fetch(endpoint, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password })
        });

        const result = await response.json();
        console.log("Login response:", result);

        if (response.ok) {
          alert(result.message);
          window.location.href = role === "admin" ? "admin.html" : "quiz.html";
        } else {
          alert(result.message || "Login failed");
        }
      } catch (err) {
        console.error("Login error:", err);
        alert("Error connecting to server.");
      }
    });
  </script>

</body>
</html>
